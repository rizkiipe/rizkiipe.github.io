<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kembali ke U-Track</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0E17;color:#E9EDF6;font:16px system-ui,sans-serif;text-align:center;padding:24px}
a{display:inline-block;margin-top:18px;background:#33D8C9;color:#06201d;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px}
small{color:#8B98B8}
</style></head>
<body><div>
<div style="font-size:20px;font-weight:700">Login Google selesai</div>
<p><small>Mengembalikan ke aplikasi U-Track…</small></p>
<a id="open" href="#">Buka U-Track</a>
</div>
<script>
// Google mengirim hasil (access_token / error) di bagian # pada alamat ini; teruskan ke app lewat skema khusus.
var h = location.hash || (location.search ? '#' + location.search.slice(1) : '');
var target = 'com.utrack.app://oauth' + h;
document.getElementById('open').href = target;
setTimeout(function(){ location.replace(target); }, 150);
</script></body></html>
