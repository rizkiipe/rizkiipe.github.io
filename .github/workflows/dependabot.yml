version: 2
updates:
  # Capacitor dan plugin-plugin-nya (package.json). Semua paket @capacitor/* dinaikkan bersamaan.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"

  # Versi action yang dipakai workflow (checkout, setup-java, dst.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
