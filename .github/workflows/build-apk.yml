name: Build & Release APK

# Satu rilis = satu versi untuk APK DAN situs https://laporan-de-uht-62ebd.web.app
# Tiga cara memicu rilis:
#   1. OTOMATIS: ubah isi file VERSION di repo (mis. jadi 1.4.8) lalu commit ke main
#   2. Manual : Actions -> "Build & Release APK" -> Run workflow -> isi nomor versi (kosong = pakai file VERSION)
#   3. Push tag, mis. v1.4.8
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi, mis. 1.0.1 (kosong = isi file VERSION)'
        required: false
        default: ''
      notes:
        description: 'Catatan update (tampil di dialog update)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['VERSION']
    tags: ['v*']

# Satu rilis pada satu waktu (rilis berikutnya menunggu yang sedang berjalan)
concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

env:
  WEB_HOST: laporan-de-uht-62ebd.web.app
  FIREBASE_PROJECT: laporan-de-uht-62ebd
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Tentukan versi
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Urutan: isian Run workflow -> nama tag -> file VERSION
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="$GITHUB_REF_NAME"; fi
          if [ -z "$VERSION" ] && [ -f VERSION ]; then VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Format versi harus angka titik, mis. 1.0.1 (dapat: '$VERSION'). Isi file VERSION atau isian Run workflow."; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$((MA*10000 + MI*100 + ${PA:-0}))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$CODE" >> "$GITHUB_ENV"

      - name: Pastikan versi baru (belum pernah dirilis dan lebih besar dari rilis terakhir)
        run: |
          TAGS=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||')
          # Kalau dipicu oleh push tag, tag itu sendiri tidak dihitung
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAGS=$(echo "$TAGS" | grep -vx "${GITHUB_REF_NAME#v}" || true); fi
          if echo "$TAGS" | grep -qx "$VERSION"; then
            echo "::error::Versi $VERSION sudah pernah dirilis. Naikkan nomor versi (file VERSION atau isian Run workflow), karena build dengan versi yang sama tidak bisa dipasang sebagai update."; exit 1
          fi
          LATEST=$(echo "$TAGS" | sed '/^$/d' | sort -V | tail -1)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::Versi $VERSION harus lebih besar dari rilis terakhir ($LATEST)."; exit 1
          fi
          echo "Versi $VERSION OK (rilis terakhir: ${LATEST:-belum ada})"

      - name: Catatan update
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Run workflow: pakai isian catatan. Push VERSION/tag: pakai pesan commit terakhir
          NOTES="$INPUT_NOTES"
          if [ -z "$NOTES" ] && [ -n "$COMMIT_MSG" ]; then NOTES="$COMMIT_MSG"; fi
          D="EOF_$(openssl rand -hex 8)"
          { echo "NOTES<<$D"; echo "$NOTES"; echo "$D"; } >> "$GITHUB_ENV"

      - name: Isi versi, alamat situs, dan repo ke index.html
        run: |
          HOST="$WEB_HOST"
          sed -i "s/var APP_VERSION = '[0-9.]*'/var APP_VERSION = '$VERSION'/; s|__HOST__|$HOST|g; s|__REPO__|$GITHUB_REPOSITORY|g" www/index.html
          grep -q "var APP_VERSION = '$VERSION'" www/index.html || { echo "APP_VERSION gagal diisi"; exit 1; }

      - name: Install dependensi dan buat proyek Android
        run: |
          rm -rf android
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore-out
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "NEW_KEY=false" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -alias utrack -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=U-Track, OU=UCI, O=UCI, C=ID"
            base64 -w0 release.jks > keystore-out/KEYSTORE_BASE64.txt
            echo "$PASS" > keystore-out/KEYSTORE_PASSWORD.txt
            echo "NEW_KEY=true" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$PASS"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build APK release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tanda tangani APK
        run: |
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK mentah: $UNSIGNED"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" out/aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias utrack --out out/U-Track.apk out/aligned.apk
          "$BT/apksigner" verify out/U-Track.apk
          rm -f out/aligned.apk out/*.idsig

      - name: Ringkasan
        run: |
          KT=$(keytool -list -v -keystore release.jks -alias utrack -storepass "$KS_PASS")
          FP1=$(echo "$KT" | grep 'SHA1:' | head -1 | sed 's/.*SHA1: *//')
          FP=$(echo "$KT" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          {
            echo "## U-Track v$VERSION"
            echo "SHA-1 sertifikat (isi di Android OAuth client, Google Cloud Console):"
            echo '```'
            echo "$FP1"
            echo '```'
            echo "SHA-256 sertifikat:"
            echo '```'
            echo "$FP"
            echo '```'
            if [ "$NEW_KEY" = "true" ]; then
              echo ""
              echo "**Keystore baru dibuat, rilis ini TIDAK dipublikasikan.** Download artifact \`keystore-SIMPAN\`, isi secret repo KEYSTORE_BASE64 dan KEYSTORE_PASSWORD, lalu jalankan workflow lagi. Tanpa secret itu tiap build memakai kunci baru dan update di tempat tidak akan bisa."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: U-Track-APK
          path: out/U-Track.apk

      - uses: actions/upload-artifact@v4
        if: env.NEW_KEY == 'true'
        with:
          name: keystore-SIMPAN
          path: keystore-out/
          retention-days: 30

      # Hanya publikasi kalau kunci tanda tangan sudah permanen (dari secret)
      - name: Publikasikan release
        if: env.NEW_KEY == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: U-Track v${{ env.VERSION }}
          body: ${{ env.NOTES }}
          files: out/U-Track.apk
          make_latest: true

      # Situs Firebase ikut isi APK: deploy folder www (yang sama persis dengan yang masuk APK)
      - name: Deploy web ke Firebase Hosting
        id: fb
        if: env.NEW_KEY == 'false'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live

      # Kirim APK ke Firebase App Distribution (opsional: hanya jika secret FIREBASE_APP_ID diisi)
      - name: Distribusi ke Firebase App Distribution
        if: env.NEW_KEY == 'false' && env.FIREBASE_APP_ID != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_DIST_GROUPS || 'tim' }}
          file: out/U-Track.apk
          releaseNotes: ${{ env.NOTES }}

      # Simpan nomor versi ke repo supaya sumber di GitHub ikut sama dengan APK dan situs
      # (pakai token bawaan Actions, jadi commit ini TIDAK memicu build baru)
      - name: Simpan nomor versi ke repo
        if: env.NEW_KEY == 'false'
        run: |
          git checkout -- www/index.html
          sed -i "s/var APP_VERSION = '[0-9.]*'/var APP_VERSION = '$VERSION'/" www/index.html
          git add www/index.html
          # Kunci versi paket: package-lock.json dibuat otomatis pada rilis pertama lalu ikut tersimpan di repo
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rilis v$VERSION"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Pastikan deploy web berhasil
        if: steps.fb.outcome == 'failure'
        run: |
          echo "::error::Deploy ke Firebase Hosting gagal. APK sudah dirilis, tetapi situs belum ter-update. Cek secret FIREBASE_SERVICE_ACCOUNT dan peran Firebase Hosting Admin."
          exit 1
