name: Cek build (pull request)

# Menjalankan build percobaan (tanpa rilis) setiap ada pull request, termasuk dari Dependabot,
# supaya pembaruan yang merusak build ketahuan sebelum digabung.
on:
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'android-overlay/**'
      - 'scripts/**'
      - '.github/workflows/build-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Buat proyek Android
        env:
          VERSION: '0.0.0'
          VCODE: '1'
        run: |
          rm -rf android
          npm install
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android

      - name: Build percobaan (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
